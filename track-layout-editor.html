<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ON-IT Track Layout Editor</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #bfc2ba;
      color: #eef2ea;
      font-family: Inter, "Helvetica Neue", Arial, sans-serif;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 390px;
      width: 100vw;
      height: 100vh;
    }

    #stage {
      position: relative;
      overflow: hidden;
      background: #bfc2ba;
    }

    #stage canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }

    #stage canvas.dragging {
      cursor: grabbing;
    }

    .sidebar {
      padding: 20px;
      border-left: 1px solid rgba(255, 255, 255, 0.12);
      background: #242822;
      overflow: auto;
    }

    h1 {
      margin: 0 0 14px;
      font-size: 20px;
      letter-spacing: 0;
    }

    .row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    button {
      height: 34px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 6px;
      padding: 0 11px;
      background: rgba(255, 255, 255, 0.08);
      color: #eef2ea;
      font-weight: 800;
      cursor: pointer;
    }

    button.primary {
      border-color: rgba(115, 174, 78, 0.9);
      background: rgba(115, 174, 78, 0.25);
    }

    button.active {
      border-color: rgba(241, 215, 94, 0.95);
      background: rgba(241, 215, 94, 0.2);
    }

    label {
      display: block;
      margin: 12px 0 5px;
      color: rgba(238, 242, 234, 0.72);
      font-size: 12px;
      font-weight: 800;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 7px;
      background: #151812;
      color: #dce8d6;
    }

    input {
      height: 34px;
      padding: 0 10px;
      font: 13px Menlo, Consolas, monospace;
    }

    textarea {
      min-height: 260px;
      resize: vertical;
      padding: 11px;
      font: 12px/1.45 Menlo, Consolas, monospace;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .stats {
      margin: 12px 0;
      color: rgba(238, 242, 234, 0.72);
      font-size: 13px;
      line-height: 1.45;
      min-height: 38px;
    }
  </style>
</head>
<body>
  <main class="app">
    <section id="stage"></section>
    <aside class="sidebar">
      <h1>Track Layout Editor</h1>
      <div class="row">
        <button id="spawnBallBtn" class="primary">Spawn Ball</button>
        <button id="resetBallBtn">Remove Ball</button>
      </div>
      <div class="row">
        <button id="selectModeBtn" class="active">Select / Drag</button>
        <button id="addRailPointBtn">Rail Point</button>
        <button id="finishRailBtn">Finish Curve</button>
        <button id="clearDraftBtn">Clear Draft</button>
      </div>
      <div class="row">
        <button id="addXyloBtn">Add Xylophone</button>
        <button id="prevBtn">Prev</button>
        <button id="nextBtn">Next</button>
        <button id="deleteBtn">Delete</button>
      </div>
      <label>Selected</label>
      <input id="selectedInput" value="none" readonly>
      <div class="grid">
        <div>
          <label>X</label>
          <input id="xInput" type="number" step="0.05">
        </div>
        <div>
          <label>Y</label>
          <input id="yInput" type="number" step="0.05">
        </div>
        <div>
          <label>Z</label>
          <input id="zInput" type="number" step="0.05">
        </div>
      </div>
      <label>Size</label>
      <input id="sizeInput" type="number" min="0.35" max="2.4" step="0.05">
      <label>Label</label>
      <input id="labelInput" type="text" maxlength="12">
      <div class="row" style="margin-top: 12px;">
        <button id="clearBtn">Clear Layout</button>
        <button id="copyBtn">Copy JSON</button>
      </div>
      <div class="stats" id="stats"></div>
      <textarea id="output" spellcheck="false"></textarea>
    </aside>
  </main>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
      }
    }
  </script>
  <script type="module" src="./track-layout-editor.js?v=spawn-once"></script>
</body>
</html>
